<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อและระบุเวลารับ - ชาไทยสั่งล่วงหน้า</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">ชาไทยริมทาง</a>
    <nav>
      <a href="index.html">หน้าแรก</a>
      <a href="product.html">เมนูทั้งหมด</a>
      <a href="admin.html">แอดมิน</a>
    </nav>
  </header>

  <div class="container">
    <div class="form-container">
      <h2 style="margin-bottom: 20px; text-align: center;">ฟอร์มสั่งซื้อเครื่องดื่ม</h2>
      
      <!-- การ์ดแสดงรูปภาพและพรีวิวสินค้าแบบเรียลไทม์ -->
      <div class="order-preview-card">
        <img id="orderProductImage" src="" alt="ภาพสินค้า" onerror="this.src='https://via.placeholder.com/300x200?text=Thai+Tea'">
        <div class="order-preview-info">
          <div id="orderProductName" class="order-preview-title">กำลังโหลดเมนู...</div>
          <div id="orderProductPrice" class="order-preview-price">฿0</div>
        </div>
      </div>

      <form id="orderForm">
        <div class="form-group">
          <label for="items">เลือกเมนูที่ต้องการสั่ง</label>
          <select id="items" required>
            <!-- ตัวเลือกสินค้าจะถูกดึงมาใส่ด้วย script.js -->
          </select>
        </div>

        <div class="form-group">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="text" id="total" readonly>
        </div>

        <div class="form-group">
          <label for="customerName">ชื่อของคุณ</label>
          <input type="text" id="customerName" required placeholder="เช่น คุณสมชาย">
        </div>

        <div class="form-group">
          <label for="contact">เบอร์โทรศัพท์ / Line ID</label>
          <input type="text" id="contact" required placeholder="เช่น 081-234-5678">
        </div>

        <div class="form-group">
          <label for="note">ระดับความหวาน / ระบุเวลารับสินค้า</label>
          <textarea id="note" rows="3" placeholder="เช่น หวาน 50% / มารับประมาณ 8:30 น."></textarea>
        </div>

        <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; padding: 14px;">ยืนยันการสั่งซื้อ</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
